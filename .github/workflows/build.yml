name: Build desktop app

# Builds FoxLogin installers twice, around the same Python backend:
#   build: pywebview window (packaging/pywebview) for every platform Camoufox ships:
#     macOS arm64 + Intel (.dmg), Windows x64 (.exe, also runs on Windows 11 ARM),
#     Linux x86_64 + arm64 (.AppImage + .tar.gz).
#   tauri: Tauri shell (packaging/tauri) for macOS arm64 + Intel, Windows x64, Linux x64.
# Pushing a tag like v1.0.2 also publishes both sets as one GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags

# A newer push to the same branch cancels the build still running for the old one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14,          arch: arm64 }
          - { name: macos-x86_64,  os: macos-15-intel,    arch: x86_64 }
          - { name: windows-x64,   os: windows-latest,    arch: x86_64 }
          - { name: linux-x86_64,  os: ubuntu-22.04,      arch: x86_64 }
          - { name: linux-arm64,   os: ubuntu-22.04-arm,  arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python packaging/release.py --check "${GITHUB_REF_NAME#v}"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt WebEngine (pywebview's Linux backend) needs these to import at build time
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfuse2 file
          A=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$A.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Optional macOS signing/notarization: add these repository secrets
          FOXLOGIN_SIGN_ID: ${{ secrets.FOXLOGIN_SIGN_ID }}
        run: python packaging/pywebview/build.py --arch ${{ matrix.arch }}

      - name: Smoke test (API server starts from the packaged app)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   APP="$(ls -d build/pyi-*/dist/FoxLogin.app)/Contents/MacOS/FoxLogin" ;;
            Windows) APP="$(ls -d build/pyi-*/dist/FoxLogin)/FoxLogin.exe" ;;
            Linux)   APP="$(ls -d build/pyi-*/dist/FoxLogin)/FoxLogin" ;;
          esac
          export FOXCLI_DATA="$RUNNER_TEMP/foxdata" FOXCLI_PORT=8799
          "$APP" --server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do
            if curl -fs http://127.0.0.1:8799/api/app; then echo; break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8799/api/app | grep -q FoxLogin || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          curl -fs -X POST http://127.0.0.1:8799/api/v1/profiles -H 'content-type: application/json' -d '{"name":"ci 1"}' | grep -q '"id"'
          "$APP" --camoufox version > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: FoxLogin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  tauri:
    name: tauri-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,  os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64,  os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    env:
      CI: "true"                  # create-dmg: skip the Finder layout step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packaging/tauri/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the Python backend
        run: python packaging/tauri/build.py --backend

      - name: Smoke-test the packaged backend
        run: python packaging/tauri/smoke_test.py

      - name: Build the Tauri app and installers
        working-directory: packaging/tauri
        run: |
          npm install
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: FoxLogin-Tauri-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packaging/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            packaging/tauri/src-tauri/target/release/bundle/msi/*.msi
            packaging/tauri/src-tauri/target/release/bundle/nsis/*.exe
            packaging/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            packaging/tauri/src-tauri/target/release/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the Tauri installers apart from the pywebview ones
        # Tauri artifacts keep their bundle/<format>/ folders; publish the files flat
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist && for f in FoxLogin_*; do mv "$f" "FoxLogin-Tauri_${f#FoxLogin_}"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
