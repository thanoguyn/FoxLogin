name: Build desktop app

# Builds FoxLogin installers twice, around the same Python backend:
#   build: pywebview window (packaging/pywebview) for every platform Camoufox ships:
#     macOS arm64 + Intel (.dmg), Windows x64 (.exe, also runs on Windows 11 ARM),
#     Linux x86_64 + arm64 (.AppImage + .tar.gz).
#   tauri: Tauri shell (packaging/tauri) for macOS arm64 + Intel, Windows x64, Linux x64.
# Every push to main is a release: the version job bumps the patch version, commits
# "Release X.Y.Z" and tags it, then both sets are built from that tag and published as
# one GitHub Release. Pushing a tag like v1.0.2 by hand (release.py) does the same.
# Put [skip release] in the commit message to only build, or [skip ci] to do nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # push the release commit + tag, create releases

# Releases from main run one at a time so two pushes never pick the same version;
# only pull requests cancel their older, still-running build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}   # empty: build only, no release
    env:
      # "Release X.Y.Z" commits come from release.py, which pushes their tag itself
      AUTO: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
            && !startsWith(github.event.head_commit.message, 'Release ')
            && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v7
        if: env.AUTO == 'true'
        with:
          ref: main   # the newest main, so the release commit can be pushed on top

      - uses: actions/setup-python@v7
        if: env.AUTO == 'true'
        with:
          python-version: "3.13"

      - id: tag
        shell: bash
        run: |
          if [ "$AUTO" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            # Pushes made with GITHUB_TOKEN don't start another workflow run
            python packaging/release.py patch
            echo "tag=v$(sed -nE 's/^VERSION = "(.*)"/\1/p' app/core.py)" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14,          arch: arm64 }
          - { name: macos-x86_64,  os: macos-15-intel,    arch: x86_64 }
          - { name: windows-x64,   os: windows-latest,    arch: x86_64 }
          - { name: linux-x86_64,  os: ubuntu-22.04,      arch: x86_64 }
          - { name: linux-arm64,   os: ubuntu-22.04-arm,  arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}   # empty: the commit that triggered the run

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag matches the app version
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: python packaging/release.py --check "${TAG#v}"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt WebEngine (pywebview's Linux backend) needs these to import at build time
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfuse2 file
          A=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$A.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Optional macOS signing/notarization: add these repository secrets
          FOXLOGIN_SIGN_ID: ${{ secrets.FOXLOGIN_SIGN_ID }}
        run: python packaging/pywebview/build.py --arch ${{ matrix.arch }}

      - name: Smoke test (API server starts from the packaged app)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   APP="$(ls -d build/pyi-*/dist/FoxLogin.app)/Contents/MacOS/FoxLogin" ;;
            Windows) APP="$(ls -d build/pyi-*/dist/FoxLogin)/FoxLogin.exe" ;;
            Linux)   APP="$(ls -d build/pyi-*/dist/FoxLogin)/FoxLogin" ;;
          esac
          export FOXCLI_DATA="$RUNNER_TEMP/foxdata" FOXCLI_PORT=8799
          "$APP" --server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do
            if curl -fs http://127.0.0.1:8799/api/app; then echo; break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8799/api/app | grep -q FoxLogin || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          curl -fs -X POST http://127.0.0.1:8799/api/v1/profiles -H 'content-type: application/json' -d '{"name":"ci 1"}' | grep -q '"id"'
          "$APP" --camoufox version > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: FoxLogin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  tauri:
    name: tauri-${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,  os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64,  os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    env:
      CI: "true"                  # create-dmg: skip the Finder layout step
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packaging/tauri/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the Python backend
        run: python packaging/tauri/build.py --backend

      - name: Smoke-test the packaged backend
        run: python packaging/tauri/smoke_test.py

      - name: Build the Tauri app and installers
        working-directory: packaging/tauri
        run: |
          npm install
          npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: FoxLogin-Tauri-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packaging/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            packaging/tauri/src-tauri/target/release/bundle/msi/*.msi
            packaging/tauri/src-tauri/target/release/bundle/nsis/*.exe
            packaging/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            packaging/tauri/src-tauri/target/release/bundle/deb/*.deb

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, build, tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Name the Tauri installers apart from the pywebview ones
        # Tauri artifacts keep their bundle/<format>/ folders; publish the files flat
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist && for f in FoxLogin_*; do mv "$f" "FoxLogin-Tauri_${f#FoxLogin_}"; done
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
