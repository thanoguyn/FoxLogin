<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FoxLogin</title>
<style>
  html, body { height: 100%; margin: 0; background: #F4F5F7; color: #1f2329;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .logo { width: 56px; height: 56px; }
  .spin { width: 22px; height: 22px; border: 3px solid #d5d8de; border-top-color: #ee755c; border-radius: 50%;
    animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  #msg { color: #6b7280; }
  #err { display: none; max-width: 560px; color: #b42318; white-space: pre-wrap; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="">
    <div class="spin" id="spin"></div>
    <div id="msg">Starting FoxLogin…</div>
    <div id="err"></div>
  </div>
  <script>
    // Called by the Tauri shell when the backend could not start
    window.foxloginError = (text) => {
      document.getElementById('spin').style.display = 'none';
      document.getElementById('msg').textContent = 'FoxLogin could not start';
      const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = text;
    };
  </script>
</body>
</html>
