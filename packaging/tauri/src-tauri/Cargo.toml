[package]
name = "foxlogin"
version = "1.0.2"
description = "FoxLogin desktop app (Tauri shell around the Python backend)"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
